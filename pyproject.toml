[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teams-playwright-mcp-server"
version = "0.2.0"
description = "A local Microsoft Teams MCP server using Teams web APIs without Microsoft Graph or Playwright"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ma-nakaya" }]
dependencies = [
  "filelock>=3.20,<4",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "mcp>=1.28,<2",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
]

[project.scripts]
teams-mcp = "teams_mcp.cli:main"
teams-mcp-server = "teams_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teams_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["teams_mcp"]
